<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cole · Juego</title>
<meta name="theme-color" content="#c60b1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: scoreboard on top, one question card below, goal celebration overlay */
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.back{align-self:flex-start;font-weight:800;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--fg)}
.crumb{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,9vw,3.2rem);line-height:.92;margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--roja)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--fg);position:relative;min-width:0}
.mode .ico{grid-row:span 2;font-size:1.8rem;line-height:1}
.mode .mt{font-family:var(--display);font-weight:900;font-size:1.5rem;text-transform:uppercase;line-height:1}
.mode .md{font-size:.85rem;color:var(--muted);line-height:1.25}
.mode[aria-pressed="true"]{border-color:var(--roja);background:color-mix(in srgb,var(--oro) 22%,var(--surface))}
.mode[aria-pressed="true"]::after{content:"✓";position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--roja);color:var(--on-accent);font-weight:800;display:grid;place-items:center;font-size:.9rem}
@media (max-width:380px){.seg{grid-template-columns:1fr}}
.board{background:var(--board);color:#fff;border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--display);text-transform:uppercase}
.board .team{font-size:.95rem;letter-spacing:.08em;opacity:.85}
.board .team.r{text-align:right}
.board .score{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#ffc400}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--roja);transition:width .3s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;font-weight:700;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.chip.tick{display:inline-flex;align-items:center;gap:6px;font-size:1rem;padding:8px 14px}
.chip.tick input{width:20px;height:20px;margin:0;accent-color:var(--roja)}
.chip.tick:has(input:checked){border-color:var(--roja);background:color-mix(in srgb,var(--oro) 22%,var(--surface))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.tense{color:var(--roja)}
.when{display:inline-block;background:var(--oro);color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:6px;align-self:flex-start}
.pron{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;margin:0;overflow-wrap:anywhere}
.clock{display:block;width:min(240px,70vw);height:auto;align-self:center}
.clock .face{fill:var(--bg);stroke:var(--fg);stroke-width:5}
.clock .num{fill:var(--fg);font:800 17px var(--body);text-anchor:middle;dominant-baseline:central}
.clock .tick{stroke:var(--muted);stroke-width:2}
.clock .h{stroke:var(--fg);stroke-width:8;stroke-linecap:round}
.clock .m{stroke:var(--roja);stroke-width:5;stroke-linecap:round}
.clock .pin{fill:var(--fg)}
.pron.long{font-family:var(--body);font-weight:800;font-size:clamp(1.25rem,5vw,1.5rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:700;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;min-height:56px}
.opt:hover{border-color:var(--navy)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.bad{border-color:var(--roja);background:color-mix(in srgb,var(--roja) 12%,var(--bg))}
.opt:disabled{cursor:default}
.ans-row{display:flex;gap:10px}
.inp{flex:1;min-width:0;font:inherit;font-size:1.4rem;font-weight:700;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.inp:focus{outline:none;border-color:var(--navy)}
.inp.good{border-color:var(--ok)}
.inp.bad{border-color:var(--roja)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{font:inherit;font-size:1.1rem;font-weight:700;width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.miss{border-left:4px solid var(--roja);padding:8px 12px;background:color-mix(in srgb,var(--roja) 8%,var(--surface));border-radius:0 10px 10px 0;font-size:.95rem}
.miss b{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--roja)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.goal{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--board) 88%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.goal .inner{background:var(--surface);border-radius:20px;overflow:hidden;width:min(360px,100%);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.goal .top{background:linear-gradient(#c60b1e 0 22%,#ffc400 22% 78%,#c60b1e 78%);padding:14px 10px}
.goal .gol{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:1;color:#c60b1e}
.goal img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;max-height:50vh}
.goal.coches img{aspect-ratio:4/3;object-position:center}
.gallery img[src*="/c/"]{object-position:center}
.goal .name{font-family:var(--display);font-weight:900;font-size:1.7rem;text-transform:uppercase;margin:10px 12px 0}
.goal .ans{color:var(--muted);margin:2px 12px 12px}
.goal .btn{margin:0 16px 16px;width:calc(100% - 32px);justify-content:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.goal .inner{animation:none}.progress i{transition:none}}
.big{font-family:var(--display);font-weight:900;font-size:4rem;line-height:1;color:var(--roja);font-variant-numeric:tabular-nums}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Todos los temas</a>
  <div class="flag" aria-hidden="true"></div>
  <header>
    <p class="crumb" id="crumb"></p>
    <h1 id="title"></h1>
  </header>

  <section aria-labelledby="modes-h">
    <h2 id="modes-h" class="lbl">¿Cómo quieres jugar?</h2>
    <div class="seg" role="group" aria-labelledby="modes-h">
      <button class="mode" id="a-pick" aria-pressed="true" data-ans="pick">
        <span class="ico" aria-hidden="true">👆</span><span class="mt">Elegir</span><span class="md">Toca 1 de 4 respuestas</span>
      </button>
      <button class="mode" id="a-write" aria-pressed="false" data-ans="write">
        <span class="ico" aria-hidden="true">✍️</span><span class="mt">Escribir</span><span class="md">Escribe tú la respuesta · nivel pro</span>
      </button>
    </div>
  </section>

  <div class="board" aria-live="polite">
    <span class="team">Goles</span><span class="score" id="score">0 : 0</span><span class="team r">Fallos</span>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <div id="tiempos"></div>

  <main class="card" id="card"></main>

  <p class="foot"><a href="creditos.html">Créditos de las fotos</a></p>
</div>

<div class="goal" id="goal" hidden>
  <div class="inner" role="dialog" aria-modal="true" aria-labelledby="gname">
    <div class="top"><div class="gol">¡GOL!</div></div>
    <img id="gimg" alt="">
    <div class="name" id="gname"></div>
    <div class="ans" id="gans"></div>
    <button class="btn" id="gnext">Siguiente ⚽</button>
  </div>
</div>

<script src="temas.js?v=20261019b"></script>
<script src="jugadores.js?v=20261019b"></script>
<script src="coches.js?v=20261019b"></script>
<script>
const $ = id => document.getElementById(id);
const read = k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]] } return a };
const norm = s => s.toLowerCase().replace(/[’']/g, "").replace(/\s+/g, " ").trim().replace(/[.!?]+$/, "").replace(/^the /, "").replace(/^(its|it is) /, "");
const plain = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

const TEMA = TEMAS.find(t => t.id === new URLSearchParams(location.search).get("t"));
if (!TEMA) location.replace("index.html");
const MAT = MATERIAS.find(m => m.id === TEMA.materia);
const SEC = SECCIONES.find(s => s.id === TEMA.seccion);
// Premio por cada acierto: jugadores de la selección, coches deportivos o varios por turnos
// (premio: "coches" | "mezcla" = jugadores y coches | lista de grupos, p. ej. ["jugadores", "coches"])
// Lamine Yamal no entra en los turnos: sale aparte cada 4 goles (ver ESTRELLA)
const GRUPOS = { jugadores: JUGADORES.length > 1 ? JUGADORES.filter(p => p.n !== "Lamine Yamal") : JUGADORES, coches: typeof COCHES !== "undefined" ? COCHES : [] };
const TURNOS = (MAT.premio === "mezcla" ? ["jugadores", "coches"] : [].concat(MAT.premio || "jugadores"))
  .map(g => shuffle([...(GRUPOS[g] || [])])).filter(g => g.length);
const PREMIOS = !TURNOS.length ? JUGADORES : TURNOS.length === 1 ? TURNOS[0]
  : Array.from({ length: Math.max(...TURNOS.map(g => g.length)) * TURNOS.length }, (_, i) => { const g = TURNOS[i % TURNOS.length]; return g[(i / TURNOS.length | 0) % g.length]; });
// Cada 4 goles sale Lamine Yamal (en el resto de goles no se repite)
const ESTRELLA = JUGADORES.find(p => p.n === "Lamine Yamal");
const ROTA = ESTRELLA && PREMIOS.length > 1 ? PREMIOS.filter(p => p !== ESTRELLA) : PREMIOS;
document.title = "Cole · " + TEMA.titulo;
$("crumb").textContent = `${MAT.nombre} · ${TEMA.periodo} · ${SEC.nombre}`;
$("title").textContent = TEMA.titulo;

let ans = "pick", filtro = "all", queue = [], total = 0, goals = 0, fails = 0, cur = null, scorers = [], pIdx = 0;
// Opciones para elegir: tablas (Mezcla de Matemáticas) o temas por número (Mezcla de Natural Science)
const OPC = TEMA.tablas || (TEMA.grupos || []).map((_, i) => i);
let sel = new Set(OPC);
if (TEMA.elegir){ const s = (read("cole:tablas9:" + TEMA.id) || []).filter(n => sel.has(n)); if (s.length) sel = new Set(s); }

// Preguntas: {when, label, prompt, answer, pool(opciones parecidas)}
function preguntas(){
  if (TEMA.tipo === "mult"){
    return TEMA.tablas.filter(a => sel.has(a)).flatMap(a => TEMA.por.map(b => {
      const r = a * b;
      // Opciones falsas parecidas: la tabla de al lado, el número vecino…
      const pool = [...new Set([a * (b - 1), a * (b + 1), (a - 1) * b, (a + 1) * b, r - 1, r + 1, r + a, r - a])]
        .filter(x => x > 0 && x !== r).map(String);
      return { when: null, label: "Tabla del " + a, prompt: `${a} × ${b} = ?`, pre: "", answer: String(r), full: `${a} × ${b} = ${r}`, pool };
    }));
  }
  if (TEMA.tipo === "reloj"){
    return TEMA.horas.flatMap(h => [0, 15, 30, 45].map(m => {
      const answer = horaEn(h, m), ant = (h + 10) % 12 + 1, sig = h % 12 + 1;
      // Opciones falsas: la misma hora con otra posición del minutero y la hora de al lado
      const pool = [...new Set([0, 15, 30, 45].map(x => horaEn(h, x)).concat(horaEn(sig, m), horaEn(ant, m)))].filter(x => x !== answer);
      return { when: null, label: "What time is it?", fig: reloj(h, m), prompt: "What time is it?", pre: "", answer,
        full: `${h}:${String(m).padStart(2, "0")} = ${answer}`, pool };
    }));
  }
  if (TEMA.tipo === "conj"){
    const ts = TEMA.tiempos.filter(t => filtro === "all" || t.id === filtro);
    return ts.flatMap(t => TEMA.pronombres.map((p, k) => {
      const pr = p[Math.random() * p.length | 0];
      const pool = [...new Set([...t.formas, ...TEMA.tiempos.map(x => x.formas[k])])];
      return { when: t.cuando, label: t.nombre, prompt: pr, pre: pr, answer: t.formas[k], pool };
    }));
  }
  if (TEMA.grupos){
    // Opciones falsas de cada pregunta: las suyas o las respuestas de su mismo tema
    return TEMA.grupos.filter((_, i) => sel.has(i)).flatMap(([titulo, items]) => {
      const all = items.map(i => i[1]);
      return items.map(([q, a, falsas]) => ({ when: null, label: titulo, prompt: q, pre: "", answer: a, pool: falsas || all }));
    });
  }
  const all = TEMA.items.map(i => i[1]);
  return TEMA.items.map(([q, a, falsas]) => ({ when: null, label: SEC.nombre, prompt: q, pre: "", answer: a, pool: falsas || all }));
}

// Reloj con agujas (SVG). Las agujas se colocan como en un reloj de verdad: la de las horas avanza con los minutos
function reloj(h, m){
  const p = (ang, r) => [100 + r * Math.sin(ang * Math.PI / 180), 100 - r * Math.cos(ang * Math.PI / 180)].map(x => x.toFixed(1));
  const nums = Array.from({ length: 12 }, (_, i) => { const [x, y] = p((i + 1) * 30, 72); return `<text class="num" x="${x}" y="${y}">${i + 1}</text>`; }).join("");
  const ticks = Array.from({ length: 60 }, (_, i) => { const [a, b] = p(i * 6, 90), [c, d] = p(i * 6, i % 5 ? 86 : 82); return `<line class="tick" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`; }).join("");
  const [hx, hy] = p((h % 12 + m / 60) * 30, 46), [mx, my] = p(m * 6, 62);
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Reloj"><circle class="face" cx="100" cy="100" r="94"/>${ticks}${nums}
    <line class="h" x1="100" y1="100" x2="${hx}" y2="${hy}"/><line class="m" x1="100" y1="100" x2="${mx}" y2="${my}"/><circle class="pin" cx="100" cy="100" r="6"/></svg>`;
}
const NUM_EN = ["twelve", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
// La hora en palabras: o'clock / quarter past / half past / quarter to (la siguiente hora)
function horaEn(h, m){
  const sig = h % 12 + 1;
  return m === 0 ? NUM_EN[h] + " o'clock" : m === 15 ? "quarter past " + NUM_EN[h] : m === 30 ? "half past " + NUM_EN[h] : "quarter to " + NUM_EN[sig];
}

// Casillas de tablas o temas (temas "Mezcla"): se puede marcar cualquier combinación, siempre al menos una.
// Si están todas marcadas, el primer toque elige solo esa tabla; los siguientes toques añaden o quitan.
function tablasUI(){
  const todas = sel.size === OPC.length;
  const nombre = n => TEMA.tablas ? "Tabla del " + n : `${n + 1} · ${TEMA.grupos[n][0]}`;
  $("tiempos").innerHTML = `<h2 class="lbl" id="t-h">${TEMA.tablas ? "¿Qué tablas?" : "¿Qué temas?"}</h2><div class="chips" role="group" aria-labelledby="t-h">
    ${OPC.map(n => `<label class="chip tick"><input type="checkbox" data-n="${n}"${sel.has(n) ? " checked" : ""}> ${nombre(n)}</label>`).join("")}
    <button class="chip" id="todas" aria-pressed="${todas}">${TEMA.tablas ? "Todas" : "Todos"}</button></div>`;
  document.querySelectorAll(".tick input").forEach(c => c.onchange = () => {
    const n = +c.dataset.n;
    if (todas) sel = new Set([n]);
    else if (c.checked) sel.add(n); else if (sel.size > 1) sel.delete(n); else { c.checked = true; return; }
    write("cole:tablas9:" + TEMA.id, [...sel]); tablasUI(); start();
  });
  $("todas").onclick = () => { sel = new Set(OPC); write("cole:tablas9:" + TEMA.id, [...sel]); tablasUI(); start(); };
}

function tiemposUI(){
  if (TEMA.elegir) return tablasUI();
  if (TEMA.tipo !== "conj" || TEMA.tiempos.length < 2) { $("tiempos").innerHTML = ""; return; }
  const b = (id, txt) => `<button class="chip" data-f="${id}" aria-pressed="${filtro === id}">${txt}</button>`;
  $("tiempos").innerHTML = `<h2 class="lbl" id="t-h">Tiempo</h2><div class="chips" role="group" aria-labelledby="t-h">
    ${b("all", "Todos los tiempos")}${TEMA.tiempos.map(t => b(t.id, `${t.cuando[0].toUpperCase() + t.cuando.slice(1)} · ${t.nombre.toLowerCase()}`)).join("")}</div>`;
  document.querySelectorAll(".chip[data-f]").forEach(c => c.onclick = () => { filtro = c.dataset.f; tiemposUI(); start(); });
}

function guardar(fin){
  const p = read("cole:" + TEMA.id) || {};
  p.empezado = true;
  if (fin && filtro === "all" && sel.size === OPC.length){ p.hecho = true; p.mejorFallos = Math.min(p.mejorFallos ?? Infinity, fails); }
  write("cole:" + TEMA.id, p);
}

function start(){
  queue = shuffle(preguntas()); total = queue.length; goals = 0; fails = 0; scorers = [];
  score(); pIdx = Math.random() * ROTA.length | 0; next();
}
function options(c){
  return shuffle([c.answer, ...shuffle(c.pool.filter(x => x !== c.answer)).slice(0, 3)]);
}
function next(){
  if (!queue.length) return end();
  cur = queue.shift();
  const keys = [...(TEMA.acentos || "")].map(c => `<button class="key" type="button" data-c="${c}">${c}</button>`).join("");
  const writeUI = `<form class="ans-row" id="f" autocomplete="off">
      <input class="inp" id="inp" aria-label="Respuesta" placeholder="…" autocapitalize="off" autocorrect="off" spellcheck="false"${TEMA.tipo === "mult" ? ' inputmode="numeric" pattern="[0-9]*"' : ""}>
      <button class="btn" type="submit">¡Chuta!</button></form>
    ${keys ? `<div class="keys" aria-label="Letras con acento">${keys}</div>` : ""}`;
  const pickUI = `<div class="opts">${options(cur).map((o, k) => `<button class="opt" id="o${k}" data-v="${o}">${cur.pre ? cur.pre + " " : ""}${o}</button>`).join("")}</div>`;
  $("card").innerHTML = `
    <div class="meta"><span class="tense">${cur.label}</span><span>${cur.again ? '<span class="tense">↻ Otra vez</span> · ' : ''}✔ ${goals} / ${total}</span></div>
    ${cur.when ? `<span class="when">${cur.when}</span>` : ""}
    ${cur.fig || ""}
    <p class="pron${cur.prompt.length > 24 || cur.fig ? " long" : ""}">${cur.prompt}</p>
    ${ans === "write" ? writeUI : pickUI}
    <div id="fb"></div>`;
  if (ans === "write"){
    $("f").onsubmit = e => { e.preventDefault(); const v = $("inp").value; if (norm(v)) answer(v); };
    document.querySelectorAll(".key").forEach(k => {
      k.onpointerdown = e => e.preventDefault();
      k.onclick = () => { const i = $("inp"), p = i.selectionStart ?? i.value.length, q = i.selectionEnd ?? p;
        i.value = i.value.slice(0, p) + k.dataset.c + i.value.slice(q); i.focus(); i.setSelectionRange(p + 1, p + 1); };
    });
    $("inp").focus();
  } else {
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.dataset.v, b));
  }
}
function answer(raw, btn){
  let v = norm(raw);
  const pr = norm(cur.pre); if (pr && v.startsWith(pr + " ")) v = v.slice(pr.length + 1);
  // Respuestas con variantes ("undécimo / decimoprimero"): vale cualquiera; "15 cuadraditos" o "6 cm": vale también solo el número
  const right = cur.answer, full = cur.full || `${cur.pre ? cur.pre + " " : ""}${right}`,
    ok = [right, ...right.split(" / ")].some(x => v === norm(x)) || (/^\d+$/.test(v) && norm(right).split(" ")[0] === v);
  document.querySelectorAll("#card input,#card button").forEach(x => x.disabled = true);
  if (btn){ document.querySelectorAll(".opt").forEach(x => { if (x.dataset.v === right) x.classList.add("good") }); if (!ok) btn.classList.add("bad"); }
  else $("inp").classList.add(ok ? "good" : "bad");
  guardar(false);
  if (ok){
    goals++; score();
    const pl = ESTRELLA && goals % 4 === 0 ? ESTRELLA : ROTA[pIdx++ % ROTA.length]; scorers.push(pl);
    $("goal").classList.toggle("coches", pl.img.includes("/c/")); $("gimg").src = pl.img; $("gimg").alt = pl.n; $("gname").textContent = pl.n;
    $("gans").textContent = `${cur.when ? cur.when + " · " : ""}${full}`;
    $("goal").hidden = false; $("gnext").focus();
  } else {
    fails++; score();
    const why = !btn && plain(v) === plain(norm(right)) ? "¡Casi! Revisa el acento." : "¡Fuera de juego!";
    cur.again = true; queue.push(cur);
    $("fb").innerHTML = `<div class="miss"><b>${why}</b> Correcto: ${full}. Esta pregunta volverá al final: ¡tendrás que acertarla!</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="cont">Siguiente</button></div>`;
    $("cont").onclick = next; $("cont").focus();
  }
}
function score(){ $("score").textContent = `${goals} : ${fails}`; $("bar").style.width = (total ? goals / total * 100 : 0) + "%"; }
function end(){
  guardar(true);
  const uniq = [...new Map(scorers.map(p => [p.n, p])).values()];
  $("card").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="meta"><span class="tense">Final del partido</span></div>
    <div class="big">${goals} : ${fails}</div>
    <p style="margin:0">${fails === 0 ? "¡Victoria perfecta! Ningún fallo." : `Goles: ${goals}, fallos: ${fails}. ¡Juega otra vez para fallar menos!`}</p>
    <div class="gallery">${uniq.map(p => `<img src="${p.img}" alt="${p.n}" title="${p.n}">`).join("")}</div>
    <div class="row"><button class="btn" id="again">Nuevo partido</button><a class="btn alt" href="index.html">Todos los temas</a></div></div>`;
  $("again").onclick = start;
}
$("gnext").onclick = () => { $("goal").hidden = true; next(); };
document.addEventListener("keydown", e => { if (!$("goal").hidden && (e.key === "Enter" || e.key === "Escape")){ e.preventDefault(); $("gnext").click(); } });
document.querySelectorAll(".mode[data-ans]").forEach(c => c.onclick = () => {
  ans = c.dataset.ans; document.querySelectorAll(".mode[data-ans]").forEach(x => x.setAttribute("aria-pressed", x === c)); start();
});
tiemposUI();
start();
</script>
</body>
